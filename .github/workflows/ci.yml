name: CI

# Same quality gate as `make check`: format-check, lint, typecheck, javadoc, test-unit (JaCoCo >= 85% lines).
# Live API tests and secrets are never used here.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_VERSION: 3.9.12
  MAVEN_SHA512: 0a1be79f02466533fc1a80abbef8796e4f737c46c6574ede5658b110899942a94db634477dfd3745501c80aef9aac0d4f841d38574373f7e2d24cce89d694f70

jobs:
  check:
    name: check (JDK ${{ matrix.java }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ matrix.java }} (Temurin)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Install Maven ${{ env.MAVEN_VERSION }}
        id: maven
        run: |
          archive="apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/${archive}"
          echo "${MAVEN_SHA512}  $RUNNER_TEMP/$archive" | sha512sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

      # Every gate step runs even when an earlier one failed, like `make check` collecting all failures.
      - name: format-check (Spotless)
        if: ${{ !cancelled() && steps.maven.outcome == 'success' }}
        run: mvn -B --no-transfer-progress spotless:check

      - name: lint (Checkstyle)
        if: ${{ !cancelled() && steps.maven.outcome == 'success' }}
        run: mvn -B --no-transfer-progress checkstyle:check

      - name: typecheck (main, tests and examples with -Xlint:all -Werror)
        if: ${{ !cancelled() && steps.maven.outcome == 'success' }}
        run: |
          mvn -B --no-transfer-progress test-compile
          docker/maven/compile-examples.sh

      - name: javadoc (doclint)
        if: ${{ !cancelled() && steps.maven.outcome == 'success' }}
        run: mvn -B --no-transfer-progress javadoc:javadoc

      - name: test-unit (without live API tests, JaCoCo >= 85% lines)
        if: ${{ !cancelled() && steps.maven.outcome == 'success' }}
        run: mvn -B --no-transfer-progress test
